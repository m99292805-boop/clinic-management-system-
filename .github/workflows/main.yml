name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: clinic-management
      RUN_NUMBER: ${{ github.run_number }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web app (Vite)
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android --assetPath resources

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set version code and name
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${RUN_NUMBER}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign AAB (only if keystore secrets are set)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          jarsigner -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${APP_NAME}-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/${APP_NAME}-release.aab"
          ls -la out

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clinic-management-debug-apk
          path: out/clinic-management-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: clinic-management-release-aab
          path: out/clinic-management-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: android/app/build/reports
          if-no-files-found: ignore
